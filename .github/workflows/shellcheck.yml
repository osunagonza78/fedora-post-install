name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on lib/ and scripts/ and run.sh
        run: |
          shellcheck --source-path=lib --external-sources \
            run.sh \
            lib/*.sh \
            scripts/*.sh
